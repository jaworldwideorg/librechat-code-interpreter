name: Sync upstream and publish images

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish the current main revision even when upstream is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-upstream-and-publish
  cancel-in-progress: false

jobs:
  sync:
    name: Check and sync upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.sync.outputs.should_publish }}
      checkout_sha: ${{ steps.sync.outputs.checkout_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch and merge upstream changes
        id: sync
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_publish) }}
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/ClickHouse/code-interpreter.git
          git fetch --no-tags upstream main

          upstream_sha=$(git rev-parse upstream/main)
          upstream_commits=$(git rev-list --count HEAD..upstream/main)
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if [ "$upstream_commits" -eq 0 ]; then
            checkout_sha=$(git rev-parse HEAD)
            echo "checkout_sha=$checkout_sha" >> "$GITHUB_OUTPUT"

            if [ "$FORCE_PUBLISH" = "true" ]; then
              echo "Upstream is unchanged; force_publish requested."
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Fork already contains upstream/main; nothing to do."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit upstream/main

          checkout_sha=$(git rev-parse HEAD)
          git push origin HEAD:main

          echo "checkout_sha=$checkout_sha" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: sync
    if: needs.sync.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: librechat/code-interpreter/api
            cache_scope: code-interpreter-api
            dockerfile: service/Dockerfile.api
            target: production
          - image: librechat/code-interpreter/file-server
            cache_scope: code-interpreter-file-server
            dockerfile: service/Dockerfile
            target: production
          - image: librechat/code-interpreter/tool-call-server
            cache_scope: code-interpreter-tool-call-server
            dockerfile: service/Dockerfile.tool-call-server
            target: production
          - image: librechat/code-interpreter/worker-sandbox
            cache_scope: code-interpreter-worker-sandbox
            dockerfile: docker/Dockerfile.worker-sandbox
            target: worker-sandbox-false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.sync.outputs.checkout_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and publish image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ needs.sync.outputs.upstream_sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
