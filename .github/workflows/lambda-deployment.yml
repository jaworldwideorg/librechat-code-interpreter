name: Lambda deployment checks
on:
  pull_request:
    paths:
      - 'helm/**'
      - 'tests/helm-lambda.test.ts'
      - '.github/workflows/lambda-deployment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lambda-deployment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install checksum-verified Helm
        run: |
          helm_tmp=$(mktemp -d)
          cd "$helm_tmp"
          curl -fsSLO https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v3.22.1-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.22.1-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Render HTTP and Lambda deployments
        run: |
          helm dependency build helm/codeapi
          bun test tests/helm-lambda.test.ts
      - name: Verify existing deployment invariants
        run: |
          tests/block_root_package_delivery.sh
          tests/package_init_runtime_rollout.sh
          tests/kvm_guest_dns.sh
          tests/sandbox_runner_healthcheck.sh
          tests/document_tooling_manifest.sh
          tests/sandbox_runner_metrics.sh
          tests/bridge_pairing_rollout.sh
